name: host-tests

# Run the host-side (Python / AOT) test suite on every push and PR. This is the
# offline half of the project — train -> export .pte -> run through the
# ExecuTorch runtime + parity, detector, robustness, and the end-to-end pipeline.
# The on-device (Android) half needs a JDK/device and is not run here.
#
# No secrets: the suite is fully offline and never touches the live AI Hub token
# (model/aihub_profile.py is not imported by any test).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv venv --python 3.11

      - name: Install the verified toolchain
        run: uv pip install -r model/requirements.txt

      - name: Run the host test suite
        run: uv run pytest tests/ -q
